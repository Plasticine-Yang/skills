name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check skills and plugin versions
        run: npm run check
      - name: Check installation
        run: npm run check-install
      - name: Create Version Pull Request or tag release
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset tag
          commit: "chore: version skills"
          title: "chore: version skills"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Clarify tag-only publication in the version PR
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          gh pr view "$PR_NUMBER" --json body --jq '.body' \
            | sed 's/the packages will be published to npm automatically/the version tag will be created automatically; this private package is not published to npm/' \
            > /tmp/skills-version-pr-body.md
          gh pr edit "$PR_NUMBER" --body-file /tmp/skills-version-pr-body.md
